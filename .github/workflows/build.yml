name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          shellcheck luci-app-autobackup/root/usr/bin/autobackup \
            luci-app-autobackup/root/etc/init.d/autobackup \
            luci-app-autobackup/root/usr/libexec/rpcd/luci.autobackup \
            luci-app-autobackup/root/etc/uci-defaults/* \
            scripts/*.sh tests/*.sh

      - name: Check Python syntax
        run: python3 -m py_compile tests/*.py

      - name: Check JavaScript syntax
        run: |
          for f in $(find luci-app-autobackup/htdocs -name '*.js'); do
            node -e "new Function('module', require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Check JSON files
        run: |
          for f in $(find luci-app-autobackup -name '*.json'); do python3 -m json.tool "$f" > /dev/null; done

      - name: Test the backend (OpenWrt 23.05 container, a folder as the USB drive)
        run: python3 tests/backend.test.py

      - name: Test the GL.iNet admin panel module
        run: |
          sudo apt-get install -y -qq lua5.1 lua-cjson >/dev/null
          luac5.1 -p luci-app-autobackup/root/usr/lib/oui-httpd/rpc/autobackup luci-app-autobackup/root/usr/share/gl-validator.d/autobackup.lua tests/gl/rpc.lua tests/gl/upload.lua
          lua5.1 tests/gl_rpc.test.lua

      - name: Test the pages in LuCI with a browser (OpenWrt 23.05 container)
        run: |
          npm install --no-save playwright-core
          node tests/luci.test.js

      - name: Test the pages in the GL.iNet admin panel with a browser (stand-in panel, real module)
        run: node tests/gl.test.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            .test-out/luci/*.png
            .test-out/gl/*.png
          if-no-files-found: ignore

      - name: Build ipk
        run: scripts/build-ipk.sh dist

      - name: Install, upgrade and remove the ipk on a clean OpenWrt 23.05
        run: sh tests/install.test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-autobackup
          path: dist/*.ipk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
